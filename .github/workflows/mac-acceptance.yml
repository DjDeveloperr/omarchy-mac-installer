name: Neo interrupted encryption diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resume:
    runs-on: [namespace-profile-arm64-linux-apple-12x32]
    timeout-minutes: 90
    concurrency:
      group: mac-acceptance-vm
      cancel-in-progress: false
    env:
      ROOT: /var/tmp/omarchy-mac-acceptance/${{ github.run_id }}-9
      TAG: omarchy-mac-edge-2026.10.20-ba06efa1974e-4a05573a4503
      PAYLOAD: omarchy-2026.10.20-aarch64-apple-silicon-mac-edge-os-package.zip
      DIGEST: 4a05573a4503656f5a8f58cfdb390c2b4d01be37d34a20ab22ce3ee1202d9856
      HARNESS: d846557b2405f9dc0bc774bef03656f3a1dcd0a6
      BOOT_FIX: 7010762941b652c24540498499d9866e809c4ffc
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Check runner and obtain exact installed payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -r /dev/kvm
          sudo -n true
          mkdir -p "$ROOT/image" "$ROOT/evidence"
          free=$(df --output=avail -B1 "$ROOT" | tail -1)
          (( free >= 75161927680 ))
          gh release download "$TAG" -R omacom/omarchy-mac-installer -D "$ROOT/image" \
            -p IMAGE -p PROVENANCE -p INSPECTION -p inputs -p installer_data.json -p '*.zip.part*'
          cat "$ROOT/image/$PAYLOAD.part00" "$ROOT/image/$PAYLOAD.part01" >"$ROOT/image/$PAYLOAD"
          echo "$DIGEST  $ROOT/image/$PAYLOAD" | sha256sum -c -
          rm "$ROOT/image/$PAYLOAD.part00" "$ROOT/image/$PAYLOAD.part01"
      - name: Prepare pinned harness and explicit interruption
        run: |
          set -euo pipefail
          git init -q "$ROOT/harness"
          git -C "$ROOT/harness" fetch -q --depth=1 https://github.com/omacom/omarchy-mac-pkgs "$HARNESS"
          git -C "$ROOT/harness" checkout -q FETCH_HEAD
          git init -q "$ROOT/boot-fix"
          git -C "$ROOT/boot-fix" fetch -q --depth=1 https://github.com/aurora-silicon/omarchy-mac-pkgs "$BOOT_FIX"
          git -C "$ROOT/boot-fix" checkout -q FETCH_HEAD
          git -C "$ROOT/boot-fix" rev-parse HEAD >"$ROOT/evidence/boot-fix-commit.txt"
          python3 scripts/neo-encryption-interrupt-probe.py "$ROOT/harness/tools/acceptance/mac-image/run" "$ROOT/boot-fix"
          bash -n "$ROOT/harness/tools/acceptance/mac-image/run"
          git -C "$ROOT/harness" diff >"$ROOT/evidence/harness-interruption.patch"
      - name: Interrupt encryption, resume, finish setup and second boot
        env:
          OMARCHY_VM_CPUS: 8
          OMARCHY_VM_MEMORY_MB: 8192
          OMARCHY_VM_RUN_ID: ${{ github.run_id }}-9
          OMARCHY_VM_IMAGE_STATE_DIR: /var/tmp/omarchy-mac-acceptance/${{ github.run_id }}-9/state
          OMARCHY_VM_EVIDENCE_DIR: /var/tmp/omarchy-mac-acceptance/${{ github.run_id }}-9/evidence
        run: |
          set -euo pipefail
          scripts/mac-acceptance-container "$ROOT/harness/tools/acceptance/mac-image/run" \
            --image "$ROOT/image" --scenario conversion,second-boot
      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: neo-encryption-resume-evidence
          path: /var/tmp/omarchy-mac-acceptance/${{ github.run_id }}-9/evidence
          retention-days: 30
      - name: Remove this diagnostic run
        if: always()
        run: |
          set +e
          [[ $ROOT =~ ^/var/tmp/omarchy-mac-acceptance/[0-9]+-9$ ]] || exit 1
          sudo -n pkill -f "[/]var/tmp/omarchy-mac-acceptance/$GITHUB_RUN_ID-9/" 2>/dev/null
          sleep 2
          findmnt -rn -o TARGET | grep -F "$ROOT/" | sort -r | while read -r target; do
            sudo -n umount -R "$target"
          done
          sudo -n dmsetup ls --target crypt 2>/dev/null | awk -v p="omarchy-vm-$GITHUB_RUN_ID-9-" 'index($1,p)==1 {print $1}' |
            while read -r mapper; do sudo -n dmsetup remove "$mapper"; done
          losetup -ln -O NAME,BACK-FILE | awk -v p="$ROOT/" 'index($2,p)==1 {print $1}' |
            while read -r loop; do sudo -n losetup -d "$loop"; done
          sudo -n rm -rf -- "$ROOT"
          test ! -e "$ROOT"
